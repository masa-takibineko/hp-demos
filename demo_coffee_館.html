<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COFFEE 館</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0608;
    --gold: #c9a84c;
    --gold-pale: #e8d49a;
    --bg2: #120810;
    --text: #e8e0d0;
    --muted: #8a7d6a;
    --border: rgba(201,168,76,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Serif JP', serif; overflow-x: hidden; }

  /* HERO — split layout */
  .hero { position: relative; height: 100vh; min-height: 600px; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  @media (max-width: 768px) { .hero { grid-template-columns: 1fr; } .hero-left { display: none; } .hero-right { width: 100%; } }
  .hero-left { position: relative; overflow: hidden; }
  .hero-left img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.7; transform: scale(1.05); animation: slowZoom 12s ease infinite alternate; }
  @keyframes slowZoom { from { transform: scale(1.05); } to { transform: scale(1.0); } }
  .hero-left::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, transparent 60%, var(--bg2) 100%); }
  .hero-right { background: var(--bg2); display: flex; align-items: center; justify-content: center; padding: 3rem 3rem 3rem 2rem; position: relative; overflow: hidden; }
  .hero-right::before { content: '館'; position: absolute; font-family: 'Cormorant Garamond', serif; font-size: 20rem; font-weight: 300; color: rgba(201,168,76,0.04); right: -2rem; bottom: -3rem; line-height: 1; pointer-events: none; }
  .hero-content { position: relative; z-index: 1; }
  .h-eyebrow { font-size: 0.7rem; letter-spacing: 0.5em; color: var(--gold); text-transform: uppercase; font-family: 'Cormorant Garamond', serif; margin-bottom: 2rem; opacity: 0; animation: fadeUp 1s 0.3s forwards; }
  .h-name { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 300; color: var(--text); line-height: 1.2; margin-bottom: 0.5rem; opacity: 0; animation: fadeUp 1s 0.6s forwards; }
  .h-name strong { font-weight: 600; color: var(--gold); }
  .h-jp { font-size: 0.9rem; color: var(--muted); letter-spacing: 0.3em; margin-bottom: 2.5rem; opacity: 0; animation: fadeUp 1s 0.9s forwards; }
  .h-rating { display: flex; align-items: baseline; gap: 0.8rem; border-left: 2px solid var(--gold); padding-left: 1rem; opacity: 0; animation: fadeUp 1s 1.2s forwards; }
  .stars { color: var(--gold); letter-spacing: 0.05em; font-size: 0.95rem; }
  .r-num { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; color: var(--gold-pale); line-height: 1; }
  .r-cnt { font-size: 0.8rem; color: var(--muted); }

  /* GALLERY */
  .gallery { padding: 6rem 2rem; background: var(--bg); }
  .sec-head { margin-bottom: 3rem; }
  .s-label { font-family: 'Cormorant Garamond', serif; font-size: 0.72rem; letter-spacing: 0.5em; color: var(--gold); text-transform: uppercase; display: block; margin-bottom: 0.6rem; }
  .s-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 300; color: var(--text); font-style: italic; }
  .slider-wrap { position: relative; max-width: 900px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 0 4px rgba(201,168,76,0.05); }
  .slider-track { display: flex; transition: transform 0.8s cubic-bezier(0.77,0,0.175,1); }
  .slide { min-width: 100%; aspect-ratio: 16/9; overflow: hidden; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s; }
  .slide img:hover { transform: scale(1.03); }
  .s-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(13,6,8,0.8); border: 1px solid var(--border); color: var(--gold); width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: all 0.3s; z-index: 10; }
  .s-btn:hover { background: var(--gold); color: var(--bg); }
  .s-btn.prev { left: 0; } .s-btn.next { right: 0; }
  .s-dots { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1.5rem; }
  .dot { width: 24px; height: 1px; background: rgba(201,168,76,0.25); cursor: pointer; transition: all 0.3s; }
  .dot.active { background: var(--gold); }

  /* INFO */
  .info { padding: 6rem 2rem; background: var(--bg2); }
  .info-grid { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  @media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }
  .i-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 2.5rem 2rem; transition: background 0.3s; }
  .i-card:hover { background: rgba(201,168,76,0.03); }
  .i-card h3 { font-family: 'Cormorant Garamond', serif; font-size: 0.72rem; letter-spacing: 0.5em; color: var(--gold); text-transform: uppercase; margin-bottom: 1rem; }
  .i-card p { color: var(--muted); line-height: 2; font-size: 0.93rem; font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; }
  .i-btn { display: inline-block; margin-top: 1.2rem; padding: 0.6rem 1.5rem; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; font-family: 'Cormorant Garamond', serif; font-size: 0.85rem; letter-spacing: 0.25em; transition: all 0.3s; }
  .i-btn:hover { background: var(--gold); color: var(--bg); }

  /* HOURS */
  .hours { padding: 6rem 2rem; background: var(--bg); }
  .h-wrap { max-width: 540px; margin: 0 auto; }
  .h-table { width: 100%; border-collapse: collapse; }
  .h-table tr { border-bottom: 1px solid var(--border); }
  .h-table td { padding: 1.2rem 0.5rem; color: var(--muted); font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; }
  .h-table td:first-child { color: var(--gold-pale); font-weight: 600; min-width: 90px; }

  /* CTA */
  .cta { padding: 7rem 2rem; background: var(--bg2); text-align: center; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); position: relative; }
  .cta::before, .cta::after { content: ''; position: absolute; left: 2rem; right: 2rem; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
  .cta::before { top: 1.5rem; } .cta::after { bottom: 1.5rem; }
  .cta h2 { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.8rem, 4vw, 3.5rem); font-weight: 300; color: var(--text); margin-bottom: 1rem; font-style: italic; }
  .cta p { color: var(--muted); margin-bottom: 2.5rem; line-height: 2; font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; }
  .cta-btn { display: inline-block; padding: 1rem 3rem; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; font-family: 'Cormorant Garamond', serif; font-size: 1rem; letter-spacing: 0.3em; transition: all 0.4s; }
  .cta-btn:hover { background: var(--gold); color: var(--bg); transform: translateY(-2px); }

  /* FOOTER */
  footer { background: #080406; padding: 2rem; text-align: center; }
  footer p { color: rgba(232,224,208,0.3); font-size: 0.8rem; }
  footer a { color: var(--gold); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  .demo-badge { position: fixed; bottom: 1.5rem; right: 1.5rem; background: rgba(0,0,0,0.78); color: #fff; padding: 0.4rem 1rem; border-radius: 100px; font-size: 0.74rem; z-index: 9999; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1); }

  @keyframes fadeUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
  .fade-in-up { opacity:0; transform:translateY(35px); transition: opacity 0.9s ease, transform 0.9s ease; }
  .fade-in-up.visible { opacity:1; transform:translateY(0); }
  .fade-in-up.d1 { transition-delay: 0.15s; } .fade-in-up.d2 { transition-delay: 0.3s; }
</style>

<script>
  let cur = 0, total = 5;
  const track = document.getElementById('sliderTrack');
  const dotsWrap = document.getElementById('sliderDots');
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => goTo(i);
    dotsWrap.appendChild(d);
  }
  function goTo(n) {
    cur = (n + total) % total;
    track.style.transform = `translateX(-${cur * 100}%)`;
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === cur));
  }
  function changeSlide(dir) { goTo(cur + dir); }
  setInterval(() => changeSlide(1), 3800);

  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll('.fade-in-up').forEach(el => obs.observe(el));
</script>
